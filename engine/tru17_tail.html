
<script>
(function(){
  const _origRoute = window._origRoute || route;
  window._origRoute = _origRoute;
  window.attachDeep = function(res){
    try{
      if(!res||res.verdict!=="DEFINE"||!res.reply||res.reply.indexOf("DEEP \u2022 ")>=0)return res;
      var node=null;
      var nodes=res.nodes_used||[];
      for(var i=0;i<nodes.length;i++){if(/^[GH]\d+$/.test(nodes[i])){node=nodes[i];break;}}
      if(!node&&typeof lexiconQuery==="function"){var lx=lexiconQuery(res.query||"");if(lx&&lx.nodes_used){for(var j=0;j<lx.nodes_used.length;j++){if(/^[GH]\d+$/.test(lx.nodes_used[j])){node=lx.nodes_used[j];break;}}}}
      if(!node)return res;
      var deep=deepEntry(node);
      if(!deep||!deep.length)return res;
      var label=node.charAt(0)==="G"?"DEEP \u2022 Thayer (1889)":"DEEP \u2022 BDB (Brown-Driver-Briggs, 1906)";
      res.reply+="\n\n"+label+"\n"+deep.map(function(x){return x.length>900?x.slice(0,900)+"\u2026":x;}).join("\n\n");
    }catch(e){}
    return res;
  };
  route = function(q){
    if(typeof isRelationalFollowUp === "function" && isRelationalFollowUp(q)) return _origRoute(q);
    const definition = typeof defineQuery === "function" ? defineQuery(q) : null;
    if(definition)return attachDeep(mergeEaston(definition,q));
    return attachDeep(_origRoute(q));
  };
})();
</script>
